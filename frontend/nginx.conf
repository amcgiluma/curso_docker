server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresion basica
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Proxy de la API al backend FastAPI (nombre de servicio en compose: backend)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta desconocida cae en index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets con hash
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
